name: Terraform CI

on:
  push:
    branches:
      - feature/pipeline

  pull_request:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: Azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Format
        working-directory: ./Envoirment/Preprod
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ./Envoirment/Preprod
        run: terraform init

      - name: Terraform Validate
        working-directory: ./Envoirment/Preprod
        run: terraform validate

      - name: Check Preprod files
        working-directory: ./Envoirment/Preprod
        run: |
          pwd
          ls -la

      - name: Terraform Plan
        working-directory: ./Envoirment/Preprod
        run: terraform plan -var-file="terraform.tfvars"